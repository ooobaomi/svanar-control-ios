name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Scripts/**'
      - 'Tests/**'
      - 'SvanarControl.xcodeproj/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID; signed builds must match the provisioning profile'
        required: true
        default: 'io.local.svanarcontrol'
        type: string
      sign:
        description: 'Also generate a signed device-installable IPA (requires repository secrets)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'io.local.svanarcontrol' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build and test native iOS arm64 app
        shell: bash
        run: bash Scripts/build_unsigned.sh
      - name: Sign for registered iPhones (optional)
        if: ${{ inputs.sign }}
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        shell: bash
        run: bash Scripts/build_signed.sh
      - name: Publish iOS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/DerivedData/Build/Products/Release-iphoneos/SvanarControl.app/Info.plist)
          tag="ios-v${version}-${GITHUB_SHA:0:7}"
          git archive --format=zip --prefix=SvanarControl-iOS/ -o "$RUNNER_TEMP/SvanarControl-iOS-source.zip" HEAD App Scripts Tests SvanarControl.xcodeproj .github/workflows/build-ios.yml README.md IOS-RELEASE-NOTES.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "iOS v${version}" --notes-file IOS-RELEASE-NOTES.md
          fi
          gh release upload "$tag" artifacts/* "$RUNNER_TEMP/SvanarControl-iOS-source.zip" --clobber
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SvanarControl-iOS-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-logs-${{ github.run_number }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 3
